# Copy this structure into Streamlit Community Cloud > App settings > Secrets.
# Never commit real credential values to Git.

SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_KEY = "YOUR_SERVER_SIDE_SUPABASE_KEY"
AUTH_TOKEN_SECRET = "GENERATE_A_LONG_RANDOM_SECRET"

USPS_CLIENT_ID = "YOUR_USPS_CLIENT_ID"
USPS_CLIENT_SECRET = "YOUR_USPS_CLIENT_SECRET"

# Official Humbird Open Platform API, configured independently per platform.
# Documentation: https://open.hihumbird.com/api/
[humbird_open_api."Haloo"]
api_key = "YOUR_HALOO_HUMBIRD_OPEN_API_KEY"

[humbird_open_api."隆丰"]
api_key = "YOUR_LONGFENG_HUMBIRD_OPEN_API_KEY"

# Google Sheets + Drive read access. Copy values from the service-account JSON.
[google_sheets_service_account]
type = "service_account"
project_id = "YOUR_GOOGLE_CLOUD_PROJECT_ID"
private_key_id = "YOUR_PRIVATE_KEY_ID"
private_key = """-----BEGIN PRIVATE KEY-----
YOUR_PRIVATE_KEY
-----END PRIVATE KEY-----
"""
client_email = "YOUR_SERVICE_ACCOUNT_EMAIL"
client_id = "YOUR_SERVICE_ACCOUNT_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "YOUR_CLIENT_CERT_URL"
universe_domain = "googleapis.com"

